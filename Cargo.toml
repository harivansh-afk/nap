[workspace]
resolver = "2"
members = ["crates/nap-proto", "crates/nap", "crates/napd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://git.harivan.sh/harivansh-afk/nap"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
